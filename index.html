<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeautyPace 护肤社区</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="auth-screen" id="authScreen">
      <div class="auth-card">
        <div class="brand auth-brand">
          <img class="brand-mark" src="assets/beautypace-icon.svg" alt="" />
          <div>
            <h1>BeautyPace</h1>
            <p>循步而行，静待焕颜</p>
          </div>
        </div>
        <div class="auth-copy">
          <h2>登录你的护肤社区</h2>
          <p>云端同步打卡、照片记录和社区互动，多人共用同一个交流平台。</p>
        </div>
        <div class="auth-tabs" role="tablist" aria-label="账号操作">
          <button class="active" type="button" data-auth-mode="login">登录</button>
          <button type="button" data-auth-mode="register">注册</button>
        </div>
        <form class="auth-form" id="authForm">
          <label>
            用户名
            <input name="username" type="text" autocomplete="username" minlength="2" maxlength="24" required />
          </label>
          <label>
            密码
            <input name="password" type="password" autocomplete="current-password" minlength="6" required />
          </label>
          <button class="primary-button" type="submit" id="authSubmit">登录</button>
          <p class="form-message" id="authMessage"></p>
        </form>
      </div>
    </section>

    <main class="app-shell is-hidden" id="appShell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-mark" src="assets/beautypace-icon.svg" alt="" />
          <div>
            <h1>BeautyPace</h1>
            <p>循步而行，静待焕颜</p>
          </div>
        </div>

        <section class="panel streak-panel">
          <span class="panel-label">连续打卡</span>
          <strong id="streakCount">0 天</strong>
          <p id="streakHint">今天还没有记录，给皮肤留一张近照吧。</p>
        </section>

        <nav class="nav-tabs" aria-label="功能切换">
          <button class="nav-tab active" type="button" data-view="checkin">今日打卡</button>
          <button class="nav-tab" type="button" data-view="timeline">记录档案</button>
          <button class="nav-tab" type="button" data-view="compare">智能对比</button>
          <button class="nav-tab" type="button" data-view="community">社区交流</button>
          <button class="nav-tab" type="button" data-view="ritual">护理计时</button>
          <button class="nav-tab" type="button" data-view="reminder">打卡提醒</button>
        </nav>

        <aside class="aroma-widget" id="aromaWidget">
          <div class="aroma-smoke" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="candle-glass" id="candleGlass" aria-label="玻璃香薰蜡烛">
            <div class="glass-rim"></div>
            <div class="wax-pool"></div>
            <div class="wick" id="candleWick"></div>
            <div class="aroma-flame" id="aromaFlame"></div>
          </div>
          <label>
            香薰蜡烛
            <select id="scentSelect">
              <option value="white-tea">白茶</option>
              <option value="rose">玫瑰</option>
              <option value="lavender">薰衣草</option>
              <option value="cedar">雪松</option>
            </select>
          </label>
          <div class="match-zone" id="matchZone">
            <button class="match-stick" type="button" id="matchStick" aria-label="移动火柴到烛芯点燃香薰"></button>
            <span>拖拽火柴到烛芯</span>
          </div>
          <button class="ghost-button aroma-off" type="button" id="aromaOffButton">熄灭</button>
        </aside>
      </aside>

      <section class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="todayText"></p>
            <h2 id="viewTitle">今日护肤打卡</h2>
          </div>
          <div class="account-bar">
            <span class="user-pill" id="userPill"></span>
            <button class="ghost-button" type="button" id="logoutButton">退出登录</button>
          </div>
        </header>

        <section class="view active" id="checkinView" aria-labelledby="viewTitle">
          <form class="checkin-grid" id="checkinForm">
            <label class="photo-uploader" for="photoInput">
              <input id="photoInput" name="photo" type="file" accept="image/*" />
              <img id="photoPreview" alt="" />
              <span class="upload-copy">
                <strong>上传今日照片</strong>
                <small>照片会保存到后端，换设备登录也能查看</small>
              </span>
            </label>

            <div class="form-panel">
              <div class="field-row">
                <label>
                  日期
                  <input id="entryDate" name="date" type="date" required />
                </label>
                <label>
                  肌肤状态
                  <select id="skinState" name="skinState">
                    <option>稳定透亮</option>
                    <option>轻微泛红</option>
                    <option>干燥紧绷</option>
                    <option>出油明显</option>
                    <option>痘痘闭口</option>
                    <option>屏障修护中</option>
                  </select>
                </label>
              </div>
              <label>
                今日使用产品
                <input id="products" name="products" type="text" placeholder="例如：氨基酸洁面、神经酰胺面霜、防晒" />
              </label>
              <label>
                使用感受与观察
                <textarea id="notes" name="notes" rows="6" placeholder="记录刺痛、吸收速度、泛红、干燥、痘痘变化等"></textarea>
              </label>
              <div class="metrics">
                <label>
                  水润度
                  <input id="hydration" name="hydration" type="range" min="1" max="5" value="3" />
                  <span id="hydrationValue">3 / 5</span>
                </label>
                <label>
                  敏感度
                  <input id="sensitivity" name="sensitivity" type="range" min="1" max="5" value="2" />
                  <span id="sensitivityValue">2 / 5</span>
                </label>
              </div>
              <button class="primary-button" type="submit">保存到云端</button>
            </div>
          </form>
        </section>

        <section class="view" id="timelineView" aria-labelledby="viewTitle">
          <div class="timeline-tools">
            <label>
              按日期查看
              <input id="dateFilter" type="date" />
            </label>
            <button class="ghost-button" type="button" id="clearFilterButton">查看全部</button>
          </div>
          <div class="timeline" id="timelineList"></div>
        </section>

        <section class="view" id="compareView" aria-labelledby="viewTitle">
          <div class="compare-controls">
            <label>
              对比起点
              <select id="beforeSelect"></select>
            </label>
            <label>
              对比终点
              <select id="afterSelect"></select>
            </label>
          </div>
          <div class="compare-stage" id="compareStage">
            <div class="compare-empty" id="compareEmpty">至少保存两条带照片的记录后，就可以进行前后对比。</div>
            <div class="compare-image-wrap" id="compareWrap">
              <img id="beforeImage" alt="对比起点照片" />
              <div class="after-mask" id="afterMask">
                <img id="afterImage" alt="对比终点照片" />
              </div>
              <input id="compareSlider" type="range" min="0" max="100" value="50" aria-label="拖动查看前后对比" />
            </div>
          </div>
          <div class="compare-notes" id="compareNotes"></div>
        </section>

        <section class="view" id="communityView" aria-labelledby="viewTitle">
          <div class="community-layout">
            <form class="share-form" id="shareForm">
              <div>
                <span class="panel-label">发布分享</span>
                <h3>写下你的产品体验</h3>
              </div>
              <label>
                标题
                <input name="title" type="text" maxlength="36" placeholder="例如：屏障修护期的面霜使用感" required />
              </label>
              <label>
                使用体会与效果
                <textarea name="body" rows="5" placeholder="说说产品搭配、肤感、变化周期、适合或不适合的人群" required></textarea>
              </label>
              <div class="field-row">
                <label>
                  年龄段
                  <select name="age">
                    <option>18-24</option>
                    <option>25-30</option>
                    <option>31-40</option>
                    <option>40+</option>
                  </select>
                </label>
                <label>
                  肤质类型
                  <select name="skinType">
                    <option>干性肌</option>
                    <option>油性肌</option>
                    <option>混合肌</option>
                    <option>敏感肌</option>
                    <option>中性肌</option>
                  </select>
                </label>
              </div>
              <div class="field-row">
                <label>
                  护肤需求
                  <select name="need">
                    <option>保湿补水</option>
                    <option>屏障修护</option>
                    <option>控油祛痘</option>
                    <option>提亮淡印</option>
                    <option>抗老紧致</option>
                    <option>舒缓退红</option>
                  </select>
                </label>
                <label>
                  标签
                  <input name="tags" type="text" placeholder="精华, 敏感肌, 修护, 不闷痘" />
                </label>
              </div>
              <button class="primary-button" type="submit">发布到社区</button>
            </form>

            <div class="community-feed">
              <div class="community-filters">
                <label>
                  搜索
                  <input id="communitySearch" type="search" placeholder="搜索标题、正文或标签" />
                </label>
                <label>
                  年龄段
                  <select id="ageFilter">
                    <option value="">全部</option>
                    <option>18-24</option>
                    <option>25-30</option>
                    <option>31-40</option>
                    <option>40+</option>
                  </select>
                </label>
                <label>
                  肤质
                  <select id="skinFilter">
                    <option value="">全部</option>
                    <option>干性肌</option>
                    <option>油性肌</option>
                    <option>混合肌</option>
                    <option>敏感肌</option>
                    <option>中性肌</option>
                  </select>
                </label>
                <label>
                  需求
                  <select id="needFilter">
                    <option value="">全部</option>
                    <option>保湿补水</option>
                    <option>屏障修护</option>
                    <option>控油祛痘</option>
                    <option>提亮淡印</option>
                    <option>抗老紧致</option>
                    <option>舒缓退红</option>
                  </select>
                </label>
              </div>
              <div class="tag-strip" id="popularTags"></div>
              <div class="share-list" id="shareList"></div>
            </div>
          </div>
        </section>

        <section class="view" id="ritualView" aria-labelledby="viewTitle">
          <div class="ritual-layout">
            <section class="timer-panel">
              <div class="timer-hero">
                <div class="timer-ring" id="timerRing">
                  <div class="camellia-orbit" id="camelliaOrbit" aria-hidden="true">
                    <span class="camellia-flower">
                      <i></i>
                      <i></i>
                      <i></i>
                      <i></i>
                      <i></i>
                      <i></i>
                      <i></i>
                      <i></i>
                      <b></b>
                    </span>
                  </div>
                  <span id="timerMinutes">15:00</span>
                  <small id="timerStepName">面膜护理</small>
                </div>
                <div class="timer-actions">
                  <button class="primary-button" type="button" id="startTimerButton">开始计时</button>
                  <button class="ghost-button" type="button" id="pauseTimerButton">暂停</button>
                  <button class="ghost-button" type="button" id="resetTimerButton">重置</button>
                </div>
                <div class="duration-control">
                  <label for="maskDurationInput">面膜时长</label>
                  <div class="duration-input-row">
                    <input id="maskDurationInput" type="number" min="1" max="60" step="1" value="15" />
                    <span>分钟</span>
                    <button class="ghost-button" type="button" id="applyDurationButton">应用</button>
                  </div>
                </div>
              </div>
            </section>

            <section class="flow-panel">
              <div>
                <span class="panel-label">今日护理流程</span>
                <h3>按步骤慢慢来</h3>
              </div>
              <div class="step-list" id="stepList"></div>
            </section>
          </div>
        </section>

        <section class="view" id="reminderView" aria-labelledby="viewTitle">
          <div class="reminder-card">
            <div>
              <span class="panel-label">每日提醒</span>
              <h3>设置固定打卡时间</h3>
              <p>提醒时间会保存到你的账号。浏览器授权通知后，网页打开期间会按时提醒。</p>
            </div>
            <label>
              提醒时间
              <input id="reminderTime" type="time" value="21:30" />
            </label>
            <div class="button-row">
              <button class="primary-button" type="button" id="saveReminderButton">保存提醒</button>
              <button class="ghost-button" type="button" id="testReminderButton">关闭通知</button>
            </div>
            <p class="reminder-status" id="reminderStatus"></p>
          </div>
        </section>
      </section>
    </main>

    <template id="entryTemplate">
      <article class="entry-card">
        <img class="entry-photo" alt="" />
        <div class="entry-body">
          <div class="entry-head">
            <div>
              <time></time>
              <h3></h3>
            </div>
            <button class="delete-button" type="button">删除</button>
          </div>
          <p class="entry-products"></p>
          <p class="entry-notes"></p>
          <div class="score-row"></div>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
